bio: >-
  Peter F. Drucker was an Austrian-born American management consultant, educator, and author whose work shaped the
  principles of modern business and organizational leadership. Known as the "father of modern management," his writings
  introduced ideas like decentralization, knowledge work, and management by objectives, influencing generations of
  business leaders and institutions.
