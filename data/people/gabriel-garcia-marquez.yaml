bio: >-
  Gabriel García Márquez was a Colombian novelist, journalist, and screenwriter, best known for popularizing the
  literary style of magical realism. His most celebrated novel, "One Hundred Years of Solitude," is considered a
  masterpiece of world literature. In 1982, he was awarded the Nobel Prize in Literature for his rich and imaginative
  storytelling that wove the fantastic with the political and personal.
