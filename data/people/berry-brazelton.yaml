tagline: Renowned pediatrician who revolutionized early childhood care
bio: >-
  Dr. T. Berry Brazelton was an influential American pediatrician, author, and researcher best known for creating the
  Neonatal Behavioral Assessment Scale (NBAS), a tool that reshaped how the medical field understands infant behavior
  and parent-child bonding. His books and television programs helped generations of parents navigate early childhood
  development with empathy and insight.
