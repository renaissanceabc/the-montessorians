bio: >-
  Angeline Stoll Lillard is Commonwealth Professor of Psychology at the University of Virginia. Her research on
  children's development includes some of the most widely cited studies of Montessori education, and her book
  Montessori: The Science Behind the Genius connects Montessori's methods to findings in developmental science.
