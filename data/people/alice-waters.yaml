tagline: Chef and food activist; founder of Chez Panisse and the Edible Schoolyard Project
bio: >-
  Alice Waters is an American chef, restaurateur, and advocate for sustainable agriculture. She founded Chez Panisse in
  Berkeley, California, pioneering the farm-to-table movement. Waters also established the Edible Schoolyard Project,
  integrating organic gardening into school curricula to teach children about healthy eating and the environment.
