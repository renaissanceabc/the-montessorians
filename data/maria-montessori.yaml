tagline: Physician and educator who created the Montessori method
bio: >-
  Maria Montessori was an Italian physician and educator who developed the Montessori method of education. After opening
  her first Casa dei Bambini in Rome in 1907, she wrote widely on children's development, including The Montessori
  Method, The Secret of Childhood, and The Absorbent Mind. In 1929 she founded the Association Montessori Internationale
  with her son Mario to carry her work forward.
