name: Setup
description: Install Bun and the workspace dependencies.

inputs:
  bun-version:
    description: Bun version to install. 1.4.4 is the first release patched for CVE-2026-111497.
    required: false
    default: "1.4.4"
  node-version:
    description: Node version to install. Floor is the CVE-2026-111497 brotli fix (24.22.1).
    required: false
    default: ">=24.22.1"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}

    # Bun's global package cache, keyed on the lockfile, so installs are mostly
    # copies. No restore-keys: a lockfile change starts from a clean cache rather
    # than carrying every old package forward.
    - name: Cache Bun packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
