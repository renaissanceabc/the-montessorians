name: Setup
description: Install Bun and the workspace dependencies.

inputs:
  bun-version:
    description: Bun version to install. 1.4.4 is the first release patched for CVE-2026-111497.
    required: false
    default: "1.4.4"
  node-version:
    description: Node version to install. Floor is the CVE-2026-111497 brotli fix (24.22.1).
    required: false
    default: ">=24.22.1"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}

    # Bun's global package cache, keyed on the lockfile, so installs are mostly
    # copies. No restore-keys: a lockfile change starts from a clean cache rather
    # than carrying every old package forward.
    - name: Cache Bun packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
