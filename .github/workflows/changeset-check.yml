name: Changeset Check

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  changeset:
    name: Require changeset
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'skip-changeset')
      && github.event.pull_request.title != 'Version Packages'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check for changeset
        id: check
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          CHANGESETS=$(git diff --name-only --diff-filter=d "origin/$BASE_REF...HEAD" -- '.changeset/*.md' | grep -v README.md || true)
          if [ -z "$CHANGESETS" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Found changeset(s):"
            echo "$CHANGESETS"
          fi

      - name: Comment on PR if missing
        if: steps.check.outputs.found == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `### Missing changeset

            This PR doesn't include a changeset. If this PR has user-facing changes (\`feat:\`, \`fix:\`) — including new or updated profiles — add one:

            \`\`\`bash
            bunx changeset
            \`\`\`

            For chore/docs/refactor PRs, add the \`skip-changeset\` label to bypass this check.`;

            // Avoid duplicate comments
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('### Missing changeset'));
            if (!existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if missing
        if: steps.check.outputs.found == 'false'
        run: exit 1
