name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read
  # Lets the job request a GitHub OIDC token for the Vercel Remote Cache.
  id-token: write

# A new push to the same PR cancels the run still in progress; pushes to
# develop/main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Vercel Remote Cache over OIDC (no stored token): see the "Connect Vercel
  # Remote Cache" step. Fork PRs can't get an OIDC token and use only the local
  # cache. PRs read the remote cache; only pushes to develop/main write to it, so
  # a PR can't poison what later runs replay.
  TURBO_CACHE: ${{ github.event_name == 'push' && 'local:rw,remote:rw' || 'local:rw,remote:r' }}
  # PRs skip next build: Vercel builds every PR preview. Pushes to develop and
  # main still build.
  TURBO_TASKS: ${{ github.event_name == 'push' && 'typecheck test build' || 'typecheck test' }}
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # The pull request gate: one required check, named Check.
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup

      # Exchanges the job's GitHub OIDC token for a short-lived, cache-only turbo
      # token (revoked when the job ends). Needs the TURBO_TEAM repo variable and a
      # Turborepo CLI OIDC policy on the Vercel team. Never fails the job.
      - name: Connect Vercel Remote Cache
        if: vars.TURBO_TEAM != '' && !github.event.pull_request.head.repo.fork
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      # Turbopack's build cache (experimental.turbopackFileSystemCacheForBuild).
      # Restores the newest one for this lockfile, so a build recompiles only
      # what changed.
      - name: Restore Next.js cache
        if: github.event_name == 'push'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/app/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Lint
        run: bun run check

      # The validator compares permanent ids against the PR's base branch, so
      # fetch just that branch's tip.
      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"

      - name: Data formatting
        run: bunx oxfmt --check "data/**/*.yaml"

      - name: Validate data
        run: bun run validate
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}

      # Marks the start, so the save below can tell whether next build ran.
      - name: Typecheck, test, and build
        run: |
          mkdir -p apps/app/.next/cache
          touch "$RUNNER_TEMP/before-build"
          # shellcheck disable=SC2086 # TURBO_TASKS is a list of task names.
          bunx turbo run $TURBO_TASKS --output-logs=errors-only

      # Saved only when next build wrote to the cache. When turbo replays the
      # build, the folder is unchanged and saving it again would only cost time.
      - name: Check for a fresh Next.js cache
        if: github.event_name == 'push'
        id: next-cache
        run: |
          if [ -n "$(find apps/app/.next/cache -type f -newer "$RUNNER_TEMP/before-build" -print -quit)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Next.js cache
        if: steps.next-cache.outputs.changed == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/app/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
