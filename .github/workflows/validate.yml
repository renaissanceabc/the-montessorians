name: Lint & Validate Profiles

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Run yamllint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint on data
        run: yamllint data

  validate:
    name: Validate schema + image rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Full history so the validator can compare ids against the base branch.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Validate YAML against JSON Schema, ids, references, and image rules
        run: bun run validate
        env:
          BASE_REF: origin/${{ github.base_ref }}
