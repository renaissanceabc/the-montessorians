name: Check dataset links

# Link rot quietly erodes sources. Check every URL in the dataset weekly and open
# an issue listing the broken ones.

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 4 --accept 200..=299,403,429
            --exclude "linkedin\\.com" --exclude "x\\.com" --exclude "instagram\\.com" --exclude "tiktok\\.com"
            "data/**/*.yaml"
          output: ./lychee/out.md
          fail: false

      - name: Open an issue for broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links in the dataset
          content-filepath: ./lychee/out.md
          labels: data, links
