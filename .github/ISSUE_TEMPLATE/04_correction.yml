name: Correction or removal
description: Something on a profile or organization is wrong, missing, or should be removed
title: "Correction: "
labels: ["correction"]
assignees: ["karelvuong"]
body:
  - type: input
    id: record
    attributes:
      label: Record id or page
      description: The id (tm0000050 for a person, tmo000022 for an organization) or the page's address
    validations:
      required: true
  - type: dropdown
    id: request
    attributes:
      label: What would you like us to do?
      options:
        - Fix something that's wrong
        - Add missing information
        - Merge a duplicate
        - Credit or remove a photo or logo
        - Remove this record
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What should change, with a source if you have one. If this is about you, say so.
    validations:
      required: true
