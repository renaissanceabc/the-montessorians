name: New profile request
description: Suggest a Montessori alum or someone who shaped the field
title: "New profile: "
labels: ["profile-request"]
assignees: ["karelvuong"]
body:
  - type: markdown
    attributes:
      value: |
        No GitHub account? Use the [form on the site](https://themontessorians.xyz/contribute) instead.
        We include people with a source we can check; the [editorial policy](https://themontessorians.xyz/about/editorial-policy) explains what counts.
  - type: dropdown
    id: kind
    attributes:
      label: They…
      options:
        - Attended Montessori
        - Contributed to the field
        - Both
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Full name
    validations:
      required: true
  - type: input
    id: tagline
    attributes:
      label: Tagline
      description: What they're known for, under 100 characters, no period at the end
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma separated, from the [tag list](https://themontessorians.xyz/tags), e.g. musician, entrepreneur
    validations:
      required: true
  - type: input
    id: roles
    attributes:
      label: Roles (contributors only)
      description: Comma separated. founder, trainer, practitioner, teacher-scholar, researcher, author, or philosopher
  - type: dropdown
    id: source_type
    attributes:
      label: Source type
      options:
        - wikipedia
        - article
        - social
        - publication
        - authority
        - personal-knowledge
        - other
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: >-
        A link showing they attended Montessori, or documenting their contribution to the field. For personal knowledge, say how you know them.
    validations:
      required: true
  - type: textarea
    id: profile
    attributes:
      label: Anything else (optional)
      description: Bio, schools, achievements, works, links, or a full profile in YAML
      render: yaml
