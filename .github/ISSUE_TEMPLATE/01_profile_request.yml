name: New profile request
description: Suggest a Montessori alum or someone who contributed to the field
title: "New profile: "
labels: ["profile-request"]
assignees: ["karelvuong"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a Montessorian! You can also use the form at
        https://themontessorians.xyz/contribute, which doesn't need a GitHub account.
        See the [editorial policy](https://github.com/renaissanceabc/the-montessorians/blob/main/docs/editorial-policy.md)
        for who we include and what counts as evidence.
  - type: dropdown
    id: kind
    attributes:
      label: They…
      options:
        - Attended Montessori
        - Contributed to the field
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Full name
    validations:
      required: true
  - type: input
    id: tagline
    attributes:
      label: Tagline
      description: A short description, under 100 characters, no period at the end
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma separated, e.g. musician, cellist. Contributors — include roles (trainer, practitioner, teacher-scholar, researcher, author, philosopher).
    validations:
      required: true
  - type: input
    id: source_type
    attributes:
      label: Source type
      description: wikipedia, article, social, publication, personal-knowledge, or other
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: >-
        A link showing they attended Montessori (alumni) or documenting their contribution (contributors). For
        personal knowledge, tell us how you know them.
    validations:
      required: true
  - type: textarea
    id: profile
    attributes:
      label: Anything else (optional)
      description: Bio, school, notable achievements or contributions, links — or a full profile in YAML.
      render: yaml
