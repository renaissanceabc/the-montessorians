version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    open-pull-requests-limit: 5
    versioning-strategy: increase
    # Conventional titles, so PR Title passes and release-please reads them.
    commit-message:
      prefix: build(deps)
    groups:
      runtime:
        dependency-type: production
        update-types: ["minor", "patch"]
      tooling:
        dependency-type: development
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
